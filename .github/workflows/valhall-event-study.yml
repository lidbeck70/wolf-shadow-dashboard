name: Valhall eventtest (nivå 1)

# Manuell: ger en bekräftad cykelvändning högre avkastning framåt än slumpdagar? Förregistrerat i
# docs/forskning/vandning_eventtest_spec.md. Resultatet i loggen och i Gisten (valhall_event_study.json).
# Ändrar inga regler.
on:
  workflow_dispatch:

jobs:
  event-study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Eventtest nivå 1
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python valhall_event_study.py

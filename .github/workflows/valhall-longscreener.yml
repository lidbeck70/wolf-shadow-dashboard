name: Valhall Long Screener-backtest (fas 4c)

# Manuell: Long Screener punkt för punkt 2008–idag, med och utan Valhalls cykel. Resultatet i
# loggen och i Gisten (valhall_fas4c.json). Ändrar inga regler.
on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Valhall fas 4c
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python valhall_fas4c.py

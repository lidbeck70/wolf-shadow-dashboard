name: Norden-proben

# Manuell: är hela Norden en bättre mätpunkt än OMXS30? Samvariation, ledning, SMA200-korsningar,
# sektorernas tidighet och Viking Nine/BERSERK med OMXS30, OMXSPI och Norden som grind (2008–idag).
# Resultatet i loggen och i Gisten (valhall_nordic_probe.json). Ändrar inga regler.
on:
  workflow_dispatch:
    inputs:
      no_gates:
        description: "Hoppa över grindvarianterna (bara serierna och tidigheten — snabbare)"
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Norden-proben
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python valhall_nordic_probe.py ${{ inputs.no_gates && '--no-gates' || '' }}

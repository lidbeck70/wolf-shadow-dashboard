name: Universum-registret

# Bygger universum-registret (Norden förval, USA, Kanada; London och Australien som extra) ur Börsdata nordiskt
# + globalt och panelens listor, och sparar universe.json + universe_<marknad>.json i Gisten. Måndagar och
# manuellt. Ändrar inga skanningar — skannrarna läser registret i egna steg.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"            # måndag 05:17 UTC, före veckans första skanningar

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Universum-registret
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python universe_scan.py

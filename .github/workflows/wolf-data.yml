name: Wolf Data (swing screener + regime)

on:
  schedule:
    # Every trading day (Mon–Fri) morning — each run reflects the previous
    # session's close, so mid-week regime shifts and setups are caught.
    # Cron is UTC. 04:30 UTC = 06:30 CEST (summer) / 05:30 CET (winter), before
    # the Stockholm open. Weekends are skipped (no new market data).
    # Started ~2 h before scheduled-scan (06:11 UTC) so the two alert_scan
    # steps never run at the same time — they share alert_state in the Gist,
    # and a parallel run could lose state or send the same alert twice.
    # Minut :17 i stället för :30 (GitHub försenar jobb på jämna och halva
    # klockslag — 29/9 kom 04:30-körningen 10:50), plus en reserv 30 min
    # senare som hoppar över sig själv om en körning redan gått.
    - cron: "17 4 * * 1-5"
    - cron: "47 4 * * 1-5"         # reserv
  workflow_dispatch: {}            # allow manual trigger from the Actions tab

concurrency:
  group: wolf-data
  cancel-in-progress: false

permissions:
  contents: read
  actions: read                    # grinden läser arbetsflödets tidigare körningar

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90            # generous: first run without universe.csv scans the full market
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Dubblettspärr: reserv-cronen hoppar över sig själv om en körning redan
      # gått inom 150 min. Manuell körning körs alltid.
      - name: Gate on duplicates
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/schedule_gate.sh wolf-data.yml

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Rolling cache: persists the Börsdata price cache (fast reruns) AND the
      # local output dir, which holds wolf_regime_history.json so the 26-week
      # history accumulates across weekly runs. Best-effort (GitHub evicts
      # caches after ~7 days unused); the screener/regime JSON itself always
      # goes to the Gist, so a lost cache only shortens the history chart.
      - name: Restore data cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            bd_cache
            public
          key: wolf-data-${{ github.run_id }}
          restore-keys: |
            wolf-data-

      - name: Generate screener + regime data
        if: steps.gate.outputs.run == 'true'
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          # Gist-scoped PAT (classic, gist scope) — same secret the other jobs use.
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          # MUST match GIST_ID in gist_storage.py so the panel tabs read what we push.
          WOLF_GIST_ID: "50348cb5b9e325c8ae91439763d5f144"
          # OMXSPI insId — pinned so wolf_data.py skips the /instruments name
          # lookup. Not sensitive (it appears in the run logs). If Börsdata ever
          # renumbers it, update here; clearing this falls back to auto-discovery.
          WOLF_INDEX_ID: "638"
          WOLF_OUTPUT_DIR: public
          WOLF_CACHE_DIR: bd_cache
          # Commit a universe.csv (Börsdata swing-screener export) to the repo root
          # to target the run and make it fast; without it the full market is scanned.
          WOLF_UNIVERSE_CSV: universe.csv
        run: python wolf_data.py

      # Larmen direkt efter datagenereringen: regimskiften och nya kandidater
      # upptäcks medan datan är minuter gammal. Temakartan hoppas över här —
      # den körs av scheduled-scan, och en hoppad karta rör inte baslinjen.
      - name: Alert scan (swing)
        if: always() && steps.gate.outputs.run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          ALERT_REPO_TOKEN: ${{ secrets.ALERT_REPO_TOKEN }}
          EMBER_GIST_ID: ${{ secrets.EMBER_GIST_ID }}
          CA_GIST_ID: ${{ secrets.CA_GIST_ID }}
        run: python alert_scan.py --no-blindspot

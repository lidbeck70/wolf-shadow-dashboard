name: Scheduled Screening

on:
  schedule:
    # Vardagar ~08/12/18 svensk tid. Cron är UTC; Stockholm = UTC+2 (sommar) /
    # UTC+1 (vinter), så båda säsongernas tider står här och grinden hoppar
    # över den andra säsongens.
    # GitHub försenar (timmar) eller tappar schemalagda jobb, värst på jämna
    # klockslag: 30/9 kom 08-körningen aldrig, 12 kördes 13:26 och 18 kördes
    # 22:21. Därför: minut :11 i stället för :00, och en reserv 30 min senare
    # som hoppar över sig själv om en körning redan gått (schedule_gate.sh).
    - cron: "11 6,10,16 * * 1-5"   # sommar (CEST): 08:11 / 12:11 / 18:11
    - cron: "41 6,10,16 * * 1-5"   # sommar, reserv
    - cron: "11 7,11,17 * * 1-5"   # vinter (CET): 08:11 / 12:11 / 18:11
    - cron: "41 7,11,17 * * 1-5"   # vinter, reserv
  workflow_dispatch: {}            # allow manual trigger from the Actions tab

concurrency:
  group: scheduled-screening
  cancel-in-progress: false

permissions:
  contents: read
  actions: read                    # grinden läser arbetsflödets tidigare körningar

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Säsong (rätt cron för sommar/vinter) + dubblettspärr (reserven hoppar
      # över sig själv om primären redan kört). Manuell körning körs alltid.
      - name: Gate on season and duplicates
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/schedule_gate.sh scheduled-scan.yml seasonal

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled screening
        if: steps.gate.outputs.run == 'true'
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          CA_GIST_ID: ${{ secrets.CA_GIST_ID }}
          EMBER_GIST_ID: ${{ secrets.EMBER_GIST_ID }}
        run: python scheduled_scan.py

      # Arc-screenerna Wolf + Viking headless med fasta inställningar —
      # resultatet till Gisten så larmsteget (och panelen) kan läsa det.
      - name: Arc screeners (Wolf + Viking)
        if: always() && steps.gate.outputs.run == 'true'
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python arc_scan.py

      # Insiderbevakaren headless — kluster ur Börsdatas insynsregister med
      # arkets poäng/grind/trigger. Resultatet till Gisten (insider_scan.json).
      - name: Insider scan
        if: always() && steps.gate.outputs.run == 'true'
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python insider_scan.py

      # Håvarna — guidens fem Börsdata-screeners körda i API:t med exakt
      # samma kriterier. Resultatet till Gisten (screens.json).
      - name: Screens (håvarna)
        if: always() && steps.gate.outputs.run == 'true'
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python screens_scan.py

      # Arkens sifferuppdatering — färska kurser/nyckeltal för raderna i
      # Insider/Tiggre/Rick Rule/Royalty/Poängmodellen som FÖRSLAG (Gisten:
      # sheets_refresh.json) + övergångar räknade med arkens egna regler.
      - name: Sheets refresh
        if: always() && steps.gate.outputs.run == 'true'
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          ALERT_REPO_TOKEN: ${{ secrets.ALERT_REPO_TOKEN }}
        run: python sheets_refresh.py

      # Schemalagda larm — swing-övergångar, Blindspots temakarta (tidig
      # cykel), EMBER eligible och Wolf/Viking-ribborna. Bara övergångar
      # larmar; tillståndet ligger i Gisten.
      - name: Alert scan
        if: always() && steps.gate.outputs.run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          ALERT_REPO_TOKEN: ${{ secrets.ALERT_REPO_TOKEN }}
          EMBER_GIST_ID: ${{ secrets.EMBER_GIST_ID }}
          CA_GIST_ID: ${{ secrets.CA_GIST_ID }}
        run: python alert_scan.py

name: Scheduled Screening

on:
  schedule:
    # Weekdays 08:00, 12:00, 18:00 Europe/Stockholm.
    # Cron is UTC. Stockholm = UTC+1 (winter) / UTC+2 (summer). Both crons
    # fire all year, so the "Gate on local hour" step below skips the run
    # whose Stockholm hour is not 08/12/18 — otherwise every weekday got six
    # full runs (Börsdata/Yahoo load and double alerts) instead of three.
    - cron: "0 6,10,16 * * 1-5"   # summer (CEST, UTC+2): 08/12/18 local
    - cron: "0 7,11,17 * * 1-5"   # winter (CET,  UTC+1): 08/12/18 local
  workflow_dispatch: {}            # allow manual trigger from the Actions tab

concurrency:
  group: scheduled-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Gate on local hour
        id: gate
        run: |
          H=$(TZ=Europe/Stockholm date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$H" = "08" ] || [ "$H" = "12" ] || [ "$H" = "18" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Stockholm $H:xx — kör."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Stockholm $H:xx — hoppar (den andra cronen täcker den här timmen)."
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled screening
        if: steps.gate.outputs.run == 'true'
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          CA_GIST_ID: ${{ secrets.CA_GIST_ID }}
          EMBER_GIST_ID: ${{ secrets.EMBER_GIST_ID }}
        run: python scheduled_scan.py

      # Arc-screenerna Wolf + Viking headless med fasta inställningar —
      # resultatet till Gisten så larmsteget (och panelen) kan läsa det.
      - name: Arc screeners (Wolf + Viking)
        if: always() && steps.gate.outputs.run == 'true'
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python arc_scan.py

      # Insiderbevakaren headless — kluster ur Börsdatas insynsregister med
      # arkets poäng/grind/trigger. Resultatet till Gisten (insider_scan.json).
      - name: Insider scan
        if: always() && steps.gate.outputs.run == 'true'
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python insider_scan.py

      # Håvarna — guidens fem Börsdata-screeners körda i API:t med exakt
      # samma kriterier. Resultatet till Gisten (screens.json).
      - name: Screens (håvarna)
        if: always() && steps.gate.outputs.run == 'true'
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python screens_scan.py

      # Arkens sifferuppdatering — färska kurser/nyckeltal för raderna i
      # Insider/Tiggre/Rick Rule/Royalty/Poängmodellen som FÖRSLAG (Gisten:
      # sheets_refresh.json) + övergångar räknade med arkens egna regler.
      - name: Sheets refresh
        if: always() && steps.gate.outputs.run == 'true'
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          ALERT_REPO_TOKEN: ${{ secrets.ALERT_REPO_TOKEN }}
        run: python sheets_refresh.py

      # Schemalagda larm — swing-övergångar, Blindspots temakarta (tidig
      # cykel), EMBER eligible och Wolf/Viking-ribborna. Bara övergångar
      # larmar; tillståndet ligger i Gisten.
      - name: Alert scan
        if: always() && steps.gate.outputs.run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          ALERT_REPO_TOKEN: ${{ secrets.ALERT_REPO_TOKEN }}
          EMBER_GIST_ID: ${{ secrets.EMBER_GIST_ID }}
          CA_GIST_ID: ${{ secrets.CA_GIST_ID }}
        run: python alert_scan.py

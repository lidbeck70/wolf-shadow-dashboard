name: Valhall långsidans cykeltest

# Manuell: ger inträde nära cykelbotten i hatad sektor överavkastning över 1–3 år? Förregistrerat i
# docs/forskning/lang_cykel_spec.md. Resultatet i loggen och i Gisten (valhall_long_study.json).
# Ändrar inga regler.
on:
  workflow_dispatch:

jobs:
  long-study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Långsidans cykeltest
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python valhall_long_study.py

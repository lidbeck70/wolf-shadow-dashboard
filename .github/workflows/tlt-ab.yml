name: TLT Calibration A/B

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch med duration_stress-signalen"
        required: true
        default: "feat/tlt-duration-stress"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run A/B calibration
        run: |
          python scripts/calibrate_tlt_ab.py | tee calib.txt
          { echo '### TLT Calibration A/B'; echo '```'; cat calib.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Post result as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "**TLT Calibration A/B** (run ${{ github.run_id }}, ref \`${{ inputs.ref }}\`):"; echo '```'; cat calib.txt 2>/dev/null || echo "inget resultat — se körningens logg"; echo '```'; } > comment.md
          gh api "repos/${{ github.repository }}/issues/156/comments" -f body="$(cat comment.md)"

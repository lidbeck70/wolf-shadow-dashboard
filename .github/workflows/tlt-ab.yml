name: TLT Calibration A/B

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch med duration_stress-signalen"
        required: true
        default: "feat/tlt-duration-stress"

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run A/B calibration
        run: python scripts/calibrate_tlt_ab.py

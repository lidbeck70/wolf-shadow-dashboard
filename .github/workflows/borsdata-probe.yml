name: Börsdata probe (diagnostik)

# Manuell engångsdiagnostik: skriver ut Börsdatas sektor-/branschlista,
# KPI-metadata och råa KPI-värden för referensbolag. Ändrar ingenting.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe Börsdata
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
        run: python borsdata_probe.py

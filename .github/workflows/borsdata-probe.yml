name: Börsdata probe (diagnostik)

# Manuell engångsdiagnostik: skriver ut Börsdatas sektor-/branschlista,
# KPI-metadata och råa KPI-värden för referensbolag, samt Börsdatas
# råvaruinstrument med prishistorik. Ändrar ingenting.
on:
  workflow_dispatch:
    inputs:
      section:
        description: "Vad som körs: commodities = bara råvarorna (snabb), kpicalc = Long Screeners KPI-kombinationer, markets = marknader och suffix, themes = största bolagen med kassaflöde per tema, sectors = största bolagen med kassaflöde per segment och marknad, all = hela proben"
        type: choice
        options: [commodities, kpicalc, markets, themes, sectors, all]
        default: commodities

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe Börsdata
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          PROBE_PIPELINE: "1"
          PROBE_SECTION: ${{ inputs.section || 'all' }}
        run: python borsdata_probe.py

name: Token Probe (temporary)

# Diagnostik, manuell: (1) är GIST_TOKEN giltig, (2) vad ligger i Gisten och
# hur laddar panelens gist_storage.load_blob det (storlek, trunkering,
# oautentiserad vs autentiserad läsning). Ändrar ingenting.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Probe GIST_TOKEN against the Gists API
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GIST_TOKEN" \
            https://api.github.com/gists)
          echo "HTTP status from GET /gists: $code"

      - name: Probe Gist contents (panel read path)
        env:
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python gist_probe.py

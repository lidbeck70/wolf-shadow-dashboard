name: Rule-köp Norden (signaler)

# Vardagsmorgnar: dagens Rule-köp i Norden (hat + kvalitet + balansräkning + katalysator, samma regler som
# docs/forskning/rule_kop_spec.md) till rule_norden_signals.json. Valhall Scan lägger dem i papperskontot
# rule_norden samma eftermiddag. Ändrar inga regler.
on:
  schedule:
    - cron: "7 6 * * 1-5"
    - cron: "37 6 * * 1-5"         # reserv
  workflow_dispatch: {}

concurrency:
  group: rule-norden-scan
  cancel-in-progress: false

permissions:
  contents: read
  actions: read                    # grinden läser arbetsflödets tidigare körningar

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate on duplicates
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/schedule_gate.sh rule-norden-scan.yml

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rule-köp Norden
        if: steps.gate.outputs.run == 'true'
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python rule_norden_scan.py

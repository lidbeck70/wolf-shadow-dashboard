name: PGM-snoddarna

# Manuell: hade köpstödet i Gold/Platinum och Gold/Palladium fungerat, med platinans långa fall och sidledes
# period 2015–2024 (risken: köpstöd för tidigt, en fallande kniv)? Förregistrerat i docs/forskning/pgm_snoddar_spec.md.
# Resultatet i loggen och i Gisten (pgm_band_study.json). Ändrar inga regler.
on:
  workflow_dispatch:

jobs:
  pgm-band:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PGM-snoddarna
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python pgm_band_study.py

name: Valhall probe (cykelkartan)

# Manuell diagnostik för Valhall: SPDR-drivare och UCITS-kandidater hos Yahoo, nordiska
# sektorindex ur Börsdata och kartan idag. Ändrar ingenting.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe Valhall
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
        run: python -m valhall.probe

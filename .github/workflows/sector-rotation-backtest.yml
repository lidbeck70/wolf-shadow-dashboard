name: Sektorrotation backtest

# Manuell: slår sektorrotationen (12–6–3 + trendfilter) marknaden? Förregistrerat i
# docs/forskning/sektorrotation_spec.md. Resultatet i loggen och i Gisten (sector_rotation_backtest.json).
# Ändrar inga regler.
on:
  workflow_dispatch:

jobs:
  rotation-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sektorrotation
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python sector_rotation_backtest.py

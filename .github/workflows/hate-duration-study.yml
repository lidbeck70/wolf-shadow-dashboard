name: Hatets varaktighet

# Manuell: hur länge är storbolagen och råvarorna hatade, lönar det sig att vänta? Förregistrerat i
# docs/forskning/hatets_varaktighet_spec.md. Resultatet i loggen och i Gisten (hate_duration.json).
# Ändrar inga regler.
on:
  workflow_dispatch:

jobs:
  hate-duration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Hatets varaktighet
        env:
          BORSDATA_API_KEY: ${{ secrets.BORSDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python hate_duration_study.py
